name: Caspy release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caspy-production-release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy tested backend and frontend
    needs: checks
    if: github.ref == 'refs/heads/main' && vars.CASPY_CLOUD_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      CASPY_BACKEND_URL: ${{ vars.CASPY_BACKEND_URL }}
      RELEASE_SHA: ${{ github.sha }}
      CASPY_CODESPACE_NAME: ${{ vars.CASPY_CODESPACE_NAME }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.13.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Deploy this exact commit to Render and verify readiness
        if: vars.CASPY_BACKEND_PROVIDER != 'codespaces'
        run: python scripts/deploy_render.py
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      - name: Deploy this exact commit to the selected Codespace
        if: vars.CASPY_BACKEND_PROVIDER == 'codespaces'
        run: python scripts/deploy_codespace.py
        env:
          GH_TOKEN: ${{ secrets.CODESPACES_TOKEN }}
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@65.12.1
      - name: Resolve the verified frontend project
        working-directory: frontend
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const {VERCEL_ORG_ID:orgId,VERCEL_PROJECT_ID:projectId}=process.env; if(!orgId||!projectId) throw Error("Configure project IDs");fs.mkdirSync(".vercel",{recursive:true});fs.writeFileSync(".vercel/project.json",JSON.stringify({orgId,projectId}));'
          vercel project inspect --non-interactive
          vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Build frontend
        working-directory: frontend
        run: vercel build --prod
      - name: Stage production build
        id: stage
        working-directory: frontend
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --prod --skip-domain)"
          DEPLOYMENT_URL="$deployment_url" node --input-type=module -e 'const s=process.env.DEPLOYMENT_URL,u=new URL(s);if(u.protocol!=="https:"||u.origin!==s||!u.hostname.endsWith(".vercel.app")) throw Error("Invalid deployment URL");'
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Verify the staged API proxy and source revision
        working-directory: frontend
        run: |
          set -euo pipefail
          vercel curl "$DEPLOYMENT_URL/api/health" --silent --fail > /tmp/caspy-health.json
          vercel curl "$DEPLOYMENT_URL/release.json" --silent --fail > /tmp/caspy-release.json
          node --input-type=module -e 'import fs from "node:fs";const h=JSON.parse(fs.readFileSync("/tmp/caspy-health.json")),r=JSON.parse(fs.readFileSync("/tmp/caspy-release.json"));if(h.status!=="ok"||h.chain_id!==84532||h.commit!==process.env.RELEASE_SHA||r.commit!==process.env.RELEASE_SHA)throw Error("Release health/source mismatch");'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
      - name: Promote the tested production build
        working-directory: frontend
        run: vercel promote "$DEPLOYMENT_URL"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.stage.outputs.url }}
