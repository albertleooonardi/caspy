name: Caspy CI

on:
  workflow_call:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.13.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: node --import tsx --test scripts/*.test.*
      - run: npm run build

  api:
    name: API and authentication checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r scripts/requirements-database.txt -r scripts/requirements-candy.txt -r blockhain/requirements.txt
      - name: Isolated unit and HTTP regression tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
        env:
          CASPY_RUN_HTTP_TESTS: '1'
          CASPY_RUN_SUPABASE_TESTS: '0'
          CASPY_RUN_CHAIN_TESTS: '0'
      - name: Voucher signatures
        run: python -m pytest blockhain/utils/test_voucher_signer.py -q
      - name: Launcher syntax
        run: bash -n run.sh scripts/shell/*.sh

  contracts:
    name: Contracts and NFT integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.13.1'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            blockhain/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: npm ci --prefix frontend
      - run: npm ci --prefix blockhain
      - name: Install pinned forge-std source
        run: |
          git init blockhain/lib/forge-std
          git -C blockhain/lib/forge-std remote add origin https://github.com/foundry-rs/forge-std.git
          git -C blockhain/lib/forge-std fetch --depth 1 origin 77041d2ce690e692d6e03cc812b57d1ddaa4d505
          git -C blockhain/lib/forge-std checkout --detach FETCH_HEAD
      - run: npm run build --prefix blockhain
      - run: npm test --prefix blockhain
      - run: python -m pip install -r scripts/requirements-database.txt -r scripts/requirements-candy.txt
      - name: NFT lifecycle against disposable Anvil
        run: python -m unittest discover -s scripts -p test_nft_integration.py -v
        env:
          CASPY_RUN_CHAIN_TESTS: '1'

  container:
    name: Cloud container build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: docker build --file deploy/api.Dockerfile --tag caspy-api:ci .
